name: NSE agent (scheduled)

# Runs the agent once every ~15 minutes during Indian market hours (09:00-16:00 IST, Mon-Fri).
# Free for private repos within the 2,000 min/month allowance (about 550 min used).
# GitHub cron is best-effort and can lag by several minutes; use the Mac daemon if you need tighter timing.
# Needs repository secrets: SMTP_USER, SMTP_APP_PASSWORD, EMAIL_TO (optional: GEMINI_API_KEY, CAPITAL,
# RISK_PCT, WATCHLIST, HOLDINGS).

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nse-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CAPITAL: ${{ secrets.CAPITAL }}
      RISK_PCT: ${{ secrets.RISK_PCT }}
      WATCHLIST: ${{ secrets.WATCHLIST }}
      HOLDINGS: ${{ secrets.HOLDINGS }}
      # F&O runs on Angel One's official API when its secrets are set (works from GitHub's servers). Without
      # them it falls back to NSE's website endpoints, which often block cloud IPs, so it stays off.
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      FNO_ENABLED: ${{ vars.FNO_ENABLED || (secrets.ANGEL_API_KEY != '' && '1' || '0') }}
      STATE_DIR: ${{ github.workspace }}/.nse_agent_state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore agent state
        uses: actions/cache/restore@v4
        with:
          path: .nse_agent_state
          key: nse-agent-state-${{ github.run_id }}
          restore-keys: nse-agent-state-
      - name: Run one agent tick
        working-directory: agent
        run: python -m nse_agent once
      - name: Save agent state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .nse_agent_state
          key: nse-agent-state-${{ github.run_id }}
